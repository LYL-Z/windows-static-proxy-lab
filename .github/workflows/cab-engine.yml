# CAB engine CI check. Windows runners only. No secrets and no production credentials.
#
# This job is a bounded check. It is not the 114-case engine harness, and a
# green run must not be reported as 114/114.
#
# The full harness remains a local gate:
#   powershell.exe -NoProfile -ExecutionPolicy Bypass -File proxy_v6/tests/Run-Tests.ps1
# That command is the suite recorded as 114 cases. This workflow does not run it.
#
# When proxy_v6/tests/repro/V69SnapshotSeal.ps1 is present, the job runs that
# script with Windows PowerShell 5.1. The script keeps a synthetic secret in a
# temporary root under V4_TEST_MODE. It does not read production snapshots,
# live credentials, or change the machine proxy.

name: CAB engine

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cab-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-seal:
    name: V69 snapshot seal
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the bounded snapshot seal
        run: |
          Write-Host 'This job runs V69SnapshotSeal.ps1. It is not the 114-case harness.'
          Write-Host 'The full harness remains a local gate: proxy_v6/tests/Run-Tests.ps1'
          $script = 'proxy_v6/tests/repro/V69SnapshotSeal.ps1'
          if (-not (Test-Path -LiteralPath $script)) {
            Write-Host "MISSING: $script"
            Write-Host 'The bounded seal script is not in this tree, so this job has nothing to run.'
            Write-Host 'This is not a pass of the 114-case harness.'
            exit 1
          }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script
          if ($null -eq $LASTEXITCODE) { exit 1 }
          exit $LASTEXITCODE
