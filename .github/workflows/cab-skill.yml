# CAB skill CI check. Windows runners only. No secrets and no production credentials.
#
# skills/windows-proxy-doctor/tests/Run-Tests.ps1 runs under Windows PowerShell 5.1
# (powershell.exe). The tests use a temporary root and synthetic fixtures. They
# do not touch the real HKCU proxy settings, WinHTTP, the network, a proxy
# client, or credentials.
#
# PowerShell 7 is not required. If pwsh is unavailable, the job says so and
# continues. A missing PowerShell 7 does not fail this job.

name: CAB skill

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cab-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-tests:
    name: windows-proxy-doctor tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report PowerShell 7 without requiring it
        run: |
          $pwsh = Get-Command -Name pwsh -ErrorAction SilentlyContinue
          if ($null -eq $pwsh) {
            Write-Host 'PowerShell 7 (pwsh) is unavailable. This job uses Windows PowerShell 5.1 and does not fail because pwsh is missing.'
          } else {
            Write-Host ('PowerShell 7 is present at ' + $pwsh.Source + '. This job does not use it.')
          }
          Write-Host ('Step shell version: ' + $PSVersionTable.PSVersion.ToString())

      - name: Run skill tests with Windows PowerShell 5.1
        run: |
          $script = 'skills/windows-proxy-doctor/tests/Run-Tests.ps1'
          if (-not (Test-Path -LiteralPath $script)) {
            Write-Host "MISSING: $script"
            exit 1
          }
          $shell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path -LiteralPath $shell)) {
            Write-Host "MISSING: $shell"
            exit 1
          }
          & $shell -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script
          if ($null -eq $LASTEXITCODE) { exit 1 }
          exit $LASTEXITCODE
