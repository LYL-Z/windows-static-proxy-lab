# workflow_dispatch only.
# Runs proxy_v6/tests/repro/V69SnapshotSeal.ps1 in a temporary root.
# The 114-case engine harness (proxy_v6/tests/Run-Tests.ps1) stays manual:
# it is long and environment-heavy, and this workflow does not call it.
# No production credentials and no repository secrets are read.

name: CAB V69 snapshot seal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v69-snapshot-seal:
    name: V69 snapshot seal
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run V69SnapshotSeal.ps1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $shell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path -LiteralPath $shell)) {
            throw 'Windows PowerShell 5.1 was not found in System32.'
          }
          & $shell -NoProfile -Command 'Write-Host ("Windows PowerShell {0}" -f $PSVersionTable.PSVersion); if ($PSVersionTable.PSVersion.Major -ne 5) { exit 2 }'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 did not start.' }
          & $shell -NoProfile -ExecutionPolicy Bypass -File proxy_v6/tests/repro/V69SnapshotSeal.ps1
          if ($LASTEXITCODE -ne 0) { throw ("V69SnapshotSeal.ps1 exited {0}" -f $LASTEXITCODE) }
