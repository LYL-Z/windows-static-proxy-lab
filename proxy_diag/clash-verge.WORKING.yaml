proxies:
- name: STAR-首跳
  type: http
  server: 127.0.0.1
  port: 11119
- name: 美国-华盛顿-SOCKS5
  type: socks5
  server: 72.245.197.103
  port: 9506
  username: <REDACTED>
  password: "<REDACTED-ROTATE-ME>"
